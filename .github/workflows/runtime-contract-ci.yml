name: Runtime Contract CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Compile public runtime surface
        run: |
          set -euo pipefail
          python -m py_compile             scripts/mmibkr_cloud_source_exchange_consumer_v1.py             scripts/mmibkr_source_vault_publish_v1.py             scripts/mmibkr_source_vault_consumer_v1.py             scripts/mmibkr_fleet_private_source_consumer_v1.py             scripts/mmibkr_fleet_source_vault_bootstrap_v1.py             tests/test_mmibkr_cloud_source_exchange_consumer_v1.py             tests/test_mmibkr_source_vault_v1.py             tests/test_mmibkr_fleet_private_source_consumer_v1.py             tests/test_mmibkr_fleet_source_vault_bootstrap_v1.py             tests/test_route_contract_v1.py

      - name: Run public runtime contract tests
        run: |
          set -euo pipefail
          python -m unittest -v             tests.test_route_contract_v1             tests.test_mmibkr_cloud_source_exchange_consumer_v1             tests.test_mmibkr_source_vault_v1             tests.test_mmibkr_fleet_private_source_consumer_v1             tests.test_mmibkr_fleet_source_vault_bootstrap_v1
