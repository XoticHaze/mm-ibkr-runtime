name: MM-IBKR Exact Parity Export R1

on:
  push:
    branches: [main]
    paths:
      - rendezvous/fire/mmibkr-exact-parity-export-r1.json

permissions:
  contents: read
  id-token: write

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Validate fire request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          node=json.loads(Path('rendezvous/fire/mmibkr-exact-parity-export-r1.json').read_text(encoding='utf-8'))
          if node.get('schema')!='mmibkr.exact_parity_export_fire.v1':
              raise SystemExit('fire schema rejected')
          sha=str(node.get('source_sha') or '').strip().lower()
          recipient=str(node.get('recipient_public_b64') or '').strip()
          keyid=str(node.get('recipient_key_id') or '').strip()
          if len(sha)!=40 or any(c not in '0123456789abcdef' for c in sha):
              raise SystemExit('source sha rejected')
          raw=base64.b64decode(recipient,validate=True)
          if len(raw)!=32 or keyid!='sha256:'+hashlib.sha256(raw).hexdigest():
              raise SystemExit('recipient identity rejected')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('REQUEST_SOURCE_SHA='+sha+'\n')
              fh.write('RECIPIENT_PUBLIC_B64='+recipient+'\n')
              fh.write('RECIPIENT_KEY_ID='+keyid+'\n')
          print('MMIBKR_EXACT_PARITY_SOURCE_SHA='+sha)
          print('MMIBKR_EXACT_PARITY_RECIPIENT_KEY_ID='+keyid)
          PY

      - name: Fetch exact private MM source through Fleet Authority
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mm-source"
          python scripts/mmibkr_fleet_private_source_consumer_v1.py \
            --source-sha "$REQUEST_SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --destination "$RUNNER_TEMP/mm-source/extracted" \
            --archive-output "$RUNNER_TEMP/mm-source/mm-source.tar.gz" \
            --output "$RUNNER_TEMP/mm-source/receipt.json" \
            --authority-base "$FLEET_AUTHORITY_BASE"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mm-source'/'receipt.json'
          n=json.loads(p.read_text(encoding='utf-8'))
          if n.get('ok') is not True or n.get('source_sha')!=os.environ['REQUEST_SOURCE_SHA']:
              raise SystemExit('exact Fleet source receipt rejected')
          if n.get('private_repository_token_used') is not False or n.get('broker_credentials_used') is not False:
              raise SystemExit('private-source safety boundary violated')
          print('MMIBKR_EXACT_PARITY_SOURCE_FETCH=PASS')
          print('MMIBKR_EXACT_PARITY_ARCHIVE_SHA256='+str(n.get('source_archive_sha256') or ''))
          print('MMIBKR_EXACT_PARITY_ARCHIVE_BYTES='+str(n.get('source_archive_bytes') or ''))
          PY

      - name: Encrypt exact private source to one-run recipient
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-export"
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF

          root=Path(os.environ['RUNNER_TEMP'])
          raw=(root/'mm-source'/'mm-source.tar.gz').read_bytes()
          recipient_raw=base64.b64decode(os.environ['RECIPIENT_PUBLIC_B64'],validate=True)
          recipient=x25519.X25519PublicKey.from_public_bytes(recipient_raw)
          eph=x25519.X25519PrivateKey.generate()
          eph_pub=eph.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          salt=os.urandom(32)
          nonce=os.urandom(12)
          shared=eph.exchange(recipient)
          key=HKDF(
              algorithm=hashes.SHA256(),
              length=32,
              salt=salt,
              info=b'mmibkr-exact-parity-export-r1',
          ).derive(shared)
          aad=json.dumps({
              'schema':'mmibkr.exact_parity_export_envelope.v1',
              'source_sha':os.environ['REQUEST_SOURCE_SHA'],
              'recipient_key_id':os.environ['RECIPIENT_KEY_ID'],
          },sort_keys=True,separators=(',',':')).encode()
          ciphertext=ChaCha20Poly1305(key).encrypt(nonce,raw,aad)
          out=root/'parity-export'
          (out/'ciphertext.bin').write_bytes(ciphertext)
          env={
              'schema':'mmibkr.exact_parity_export_envelope.v1',
              'source_sha':os.environ['REQUEST_SOURCE_SHA'],
              'recipient_key_id':os.environ['RECIPIENT_KEY_ID'],
              'ephemeral_public_b64':base64.b64encode(eph_pub).decode(),
              'salt_b64':base64.b64encode(salt).decode(),
              'nonce_b64':base64.b64encode(nonce).decode(),
              'aad_b64':base64.b64encode(aad).decode(),
              'ciphertext_sha256':hashlib.sha256(ciphertext).hexdigest(),
              'ciphertext_bytes':len(ciphertext),
              'plaintext_sha256':hashlib.sha256(raw).hexdigest(),
              'plaintext_bytes':len(raw),
              'private_source_plaintext_published':False,
          }
          (out/'envelope.json').write_text(json.dumps(env,sort_keys=True)+'\n',encoding='utf-8')
          print('MMIBKR_EXACT_PARITY_ENCRYPTED=PASS')
          print('MMIBKR_EXACT_PARITY_CIPHERTEXT_SHA256='+env['ciphertext_sha256'])
          PY

      - name: Upload encrypted exact parity source
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmibkr-exact-parity-export-${{ github.run_id }}
          path: ${{ runner.temp }}/parity-export
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Emit sanitized receipt
        shell: bash
        run: |
          echo "MMIBKR_EXACT_PARITY_EXPORT_STATUS=PASS"
          echo "MMIBKR_EXACT_PARITY_EXPORT_SOURCE_SHA=$REQUEST_SOURCE_SHA"
          echo "MMIBKR_EXACT_PARITY_EXPORT_ARTIFACT_ID=${{ steps.artifact.outputs.artifact-id }}"
          echo "MMIBKR_EXACT_PARITY_EXPORT_ARTIFACT_DIGEST=${{ steps.artifact.outputs.artifact-digest }}"
          echo "MMIBKR_EXACT_PARITY_PRIVATE_PLAINTEXT_PUBLISHED=0"

      - name: Destroy one-run private source
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mm-source" "$RUNNER_TEMP/parity-export"
          echo "MMIBKR_EXACT_PARITY_PRIVATE_SOURCE_DESTROYED=1"
