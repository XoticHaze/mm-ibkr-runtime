name: MM-IBKR Selected Runtime Cloud R1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-hex private MM-IBKR source SHA approved by Fleet Authority
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - rendezvous/fire/mmibkr-selected-runtime-cloud-r1.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mmibkr-selected-runtime-cloud-r1.yml
      - scripts/mmibkr_fleet_private_source_consumer_v1.py
      - scripts/mmibkr_fleet_source_vault_bootstrap_v1.py
      - scripts/mmibkr_source_vault_publish_v1.py
      - scripts/mmibkr_source_vault_consumer_v1.py
      - tests/test_mmibkr_fleet_private_source_consumer_v1.py
      - tests/test_mmibkr_fleet_source_vault_bootstrap_v1.py
      - tests/test_mmibkr_source_vault_v1.py

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev
  SOURCE_VAULT_REPO: XoticHaze/mm-ibkr-runtime
  SOURCE_VAULT_BRANCH: mmibkr-source-vault

permissions:
  contents: read
  id-token: write

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Validate hostless reusable source-vault contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/mmibkr_fleet_private_source_consumer_v1.py \
            scripts/mmibkr_fleet_source_vault_bootstrap_v1.py \
            scripts/mmibkr_source_vault_publish_v1.py \
            scripts/mmibkr_source_vault_consumer_v1.py \
            scripts/mmibkr_source_vault_rsa_interop_probe_v1.py \
            tests/test_mmibkr_fleet_private_source_consumer_v1.py \
            tests/test_mmibkr_fleet_source_vault_bootstrap_v1.py \
            tests/test_mmibkr_source_vault_rsa_interop_probe_v1.py \
            tests/test_mmibkr_source_vault_v1.py
          python -m unittest -v \
            tests.test_mmibkr_fleet_private_source_consumer_v1 \
            tests.test_mmibkr_fleet_source_vault_bootstrap_v1 \
            tests.test_mmibkr_source_vault_rsa_interop_probe_v1 \
            tests.test_mmibkr_source_vault_v1

  source-vault-bootstrap:
    if: ${{ github.event_name != 'pull_request' }}
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Resolve exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              node=json.loads(Path('rendezvous/fire/mmibkr-selected-runtime-cloud-r1.json').read_text())
              source=str(node.get('source_sha') or '').strip().lower()
          else:
              event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              source=str((event.get('inputs') or {}).get('source_sha') or '').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{40}',source):
              raise SystemExit('exact 40-hex source_sha required')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('PRIVATE_HEAD='+source+'\n')
          print('MMIBKR_PRIVATE_HEAD='+source)
          PY
      - name: Bootstrap reusable encrypted snapshot only when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/mmibkr-source-vault-bootstrap"
          mkdir -p "$work"
          python scripts/mmibkr_fleet_source_vault_bootstrap_v1.py \
            --source-sha "$PRIVATE_HEAD" \
            --run-id "$GITHUB_RUN_ID" \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --public-repo "$SOURCE_VAULT_REPO" \
            --public-branch "$SOURCE_VAULT_BRANCH" \
            --work-root "$work/private" \
            --output "$work/bootstrap-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mmibkr-source-vault-bootstrap'/'bootstrap-receipt.json'
          node=json.loads(p.read_text())
          if node.get('ok') is not True:
              raise SystemExit('source-vault bootstrap failed')
          if node.get('runtime_private_repository_token_used') is not False:
              raise SystemExit('runtime private-repository token boundary violated')
          if node.get('fleet_private_source_credential_exposed') is not False:
              raise SystemExit('Fleet private-source credential exposure boundary violated')
          if node.get('public_plaintext_included') is not False:
              raise SystemExit('public plaintext boundary violated')
          if node.get('source_sha') != os.environ['PRIVATE_HEAD']:
              raise SystemExit('source-vault bootstrap source identity mismatch')
          print('MMIBKR_SOURCE_VAULT_BOOTSTRAP_STATUS='+str(node.get('status')))
          print('MMIBKR_SOURCE_VAULT_MANIFEST_SHA256='+str(node.get('manifest_sha256')))
          PY
      - name: Destroy bootstrap private material
        if: ${{ always() }}
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/mmibkr-source-vault-bootstrap"

  finite-source-acceptance:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [source-contract, source-vault-bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install fixed source-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Resolve exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              node=json.loads(Path('rendezvous/fire/mmibkr-selected-runtime-cloud-r1.json').read_text())
              source=str(node.get('source_sha') or '').strip().lower()
          else:
              event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              source=str((event.get('inputs') or {}).get('source_sha') or '').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{40}',source):
              raise SystemExit('exact 40-hex source_sha required')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('PRIVATE_HEAD='+source+'\n')
          print('MMIBKR_PRIVATE_HEAD='+source)
          PY
      - name: Probe runtime-to-Fleet RSA-OAEP boundary
        run: |
          set -euo pipefail
          python scripts/mmibkr_source_vault_rsa_interop_probe_v1.py \
            --source-sha "$PRIVATE_HEAD" \
            --run-id "$GITHUB_RUN_ID" \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --public-repo "$SOURCE_VAULT_REPO" \
            --public-branch "$SOURCE_VAULT_BRANCH"

      - name: Materialize approved exact-SHA reusable source snapshot
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mmibkr-source"
          python scripts/mmibkr_source_vault_consumer_v1.py \
            --source-sha "$PRIVATE_HEAD" \
            --run-id "$GITHUB_RUN_ID" \
            --authority-base "$FLEET_AUTHORITY_BASE" \
            --public-repo "$SOURCE_VAULT_REPO" \
            --public-branch "$SOURCE_VAULT_BRANCH" \
            --destination "$RUNNER_TEMP/mmibkr-source/extracted" \
            --archive-output "$RUNNER_TEMP/mmibkr-source/mm-ibkr-source.tar.gz" \
            --output "$RUNNER_TEMP/mmibkr-source/materialization-host.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'mmibkr-source'
          node=json.loads((root/'materialization-host.json').read_text())
          if node.get('ok') is not True or node.get('vault_attestation_verified') is not True:
              raise SystemExit('approved reusable source attestation missing')
          if node.get('private_repository_token_used') is not False or node.get('plaintext_emitted') is not False:
              raise SystemExit('source-vault publication boundary violated')
          if node.get('source_transport') != 'fleet_authority_exact_sha_encrypted_snapshot_vault':
              raise SystemExit('canonical reusable vault transport missing')
          source_root=Path(node['source_root'])
          if not (source_root/'Dockerfile.bot').is_file():
              raise SystemExit('Dockerfile.bot missing')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as fh:
              fh.write('PRIVATE_SOURCE_ROOT='+str(source_root)+'\n')
              fh.write('SOURCE_ARCHIVE_SHA256='+node['source_archive_sha256']+'\n')
              fh.write('SOURCE_MANIFEST_SHA256='+node['source_manifest_sha256']+'\n')
          print('MMIBKR_SOURCE_ARCHIVE_SHA256='+node['source_archive_sha256'])
          print('MMIBKR_SOURCE_MANIFEST_SHA256='+node['source_manifest_sha256'])
          PY
      - name: Build exact private bot image through Dockerfile.bot
        run: |
          set -euo pipefail
          docker build -f "$PRIVATE_SOURCE_ROOT/Dockerfile.bot" --target bot -t "mmibkr-vault:$GITHUB_RUN_ID" "$PRIVATE_SOURCE_ROOT"
      - name: Run private hostless/runtime contract suite in exact image
        run: |
          set -euo pipefail
          docker run --rm "mmibkr-vault:$GITHUB_RUN_ID" python -m unittest -v \
            tests.test_selected_runtime_execution_roll_v1 \
            tests.test_selected_runtime_execution_expiry_guard_v1 \
            tests.test_selected_runtime_futures_roll_maintenance_v1 \
            tests.test_selected_runtime_signal_history_contract_v1 \
            tests.test_runtime_market_data_cache_cursor_v1 \
            tests.test_runtime_market_data_cache_checkpoint_v1 \
            tests.test_selected_runtime_cloud_runner_dry_plan_v1 \
            tests.test_selected_runtime_boundary_snapshot_hydrator_v1 \
            tests.test_selected_runtime_cloud_natural_evaluator_v1 \
            tests.test_selected_runtime_cloud_cycle_v1 \
            tests.test_selected_runtime_cloud_daemon_v1 \
            tests.test_ibkr_remote_selected_runtime_boundary_slot_v1 \
            tests.test_ibkr_remote_selected_runtime_paper_execute_slot_v1 \
            tests.test_mmibkr_cloud_source_relay_v1 \
            tests.test_ibkr_remote_warm_read_v1
      - name: Emit finite source acceptance receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          receipt={
            'schema':'mmibkr.source_vault_finite_acceptance.v1',
            'ok':True,
            'source_sha':os.environ['PRIVATE_HEAD'],
            'source_archive_sha256':os.environ['SOURCE_ARCHIVE_SHA256'],
            'source_manifest_sha256':os.environ['SOURCE_MANIFEST_SHA256'],
            'source_transport':'fleet_authority_exact_sha_encrypted_snapshot_vault',
            'dockerfile':'Dockerfile.bot',
            'private_contract_suite':'passed',
            'broker_action':False,
            'candidate_fabricated':False,
            'private_repository_token_used':False,
            'live_execution_allowed':False,
          }
          print('MMIBKR_SOURCE_VAULT_FINITE_ACCEPTANCE='+json.dumps(receipt,sort_keys=True))
          PY
      - name: Destroy private runtime material
        if: ${{ always() }}
        run: |
          set +e
          docker image rm "mmibkr-vault:$GITHUB_RUN_ID" >/dev/null 2>&1
          rm -rf "$RUNNER_TEMP/mmibkr-source"
