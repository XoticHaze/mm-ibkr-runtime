name: MM-IBKR Source Vault Bootstrap R1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact code-approved private MM-IBKR source SHA
        required: true
        type: string
      validation_profile:
        description: Stage-scoped native acceptance (strict_ui by default; p0_owner excludes UI-only tests)
        required: false
        type: choice
        options:
          - strict_ui
          - p0_owner
  push:
    branches:
      - main
    paths:
      - 'rendezvous/fire/mmibkr-source-vault-bootstrap-r1'
      - '.github/workflows/mmibkr-source-vault-bootstrap-r1.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mmibkr-source-vault-bootstrap-r1.yml'
      - 'scripts/mmibkr_fleet_source_vault_bootstrap_v1.py'
      - 'scripts/mmibkr_fleet_private_source_consumer_v1.py'
      - 'scripts/mmibkr_source_vault_publish_v1.py'
      - 'tests/test_mmibkr_fleet_source_vault_bootstrap_v1.py'
      - 'tests/test_mmibkr_source_vault_v1.py'

permissions:
  contents: write
  id-token: write

concurrency:
  group: mmibkr-source-vault-bootstrap-r1
  cancel-in-progress: false

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.16'

      - name: Validate source-vault bootstrap tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography==46.0.1
          python -m py_compile             scripts/mmibkr_fleet_private_source_consumer_v1.py             scripts/mmibkr_fleet_source_vault_bootstrap_v1.py             scripts/mmibkr_source_vault_publish_v1.py
          python -m unittest -v             tests.test_mmibkr_fleet_source_vault_bootstrap_v1             tests.test_mmibkr_source_vault_v1

  bootstrap:
    if: ${{ github.event_name != 'pull_request' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.16'

      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Resolve exact source request
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          recipient = ''
          recipient_key_id = ''
          validation_profile = 'strict_ui'
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              fire = Path('rendezvous/fire/mmibkr-source-vault-bootstrap-r1')
              if not fire.is_file():
                  raise SystemExit('source-vault bootstrap fire request missing')
              node = json.loads(fire.read_text(encoding='utf-8'))
              source_sha = str(node.get('source_sha') or '').strip().lower()
              validation_profile = str(node.get('validation_profile') or 'strict_ui').strip().lower()
              recipient = str(node.get('parity_export_recipient_public_b64') or '').strip()
              recipient_key_id = str(node.get('parity_export_recipient_key_id') or '').strip()
          else:
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
              source_sha = str((event.get('inputs') or {}).get('source_sha') or '').strip().lower()
              validation_profile = str((event.get('inputs') or {}).get('validation_profile') or 'strict_ui').strip().lower()

          if len(source_sha) != 40 or any(ch not in '0123456789abcdef' for ch in source_sha):
              raise SystemExit('exact 40-hex source_sha required')
          if validation_profile not in {'strict_ui', 'p0_owner'}:
              raise SystemExit('source validation profile rejected')

          requested = bool(recipient or recipient_key_id)
          if requested:
              import base64, hashlib
              raw = base64.b64decode(recipient, validate=True)
              if len(raw) != 32:
                  raise SystemExit('parity export recipient key rejected')
              expected_key_id = 'sha256:' + hashlib.sha256(raw).hexdigest()
              if recipient_key_id != expected_key_id:
                  raise SystemExit('parity export recipient key id mismatch')

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('REQUEST_SOURCE_SHA=' + source_sha + '\n')
              fh.write('REQUEST_VALIDATION_PROFILE=' + validation_profile + '\n')
              fh.write('PARITY_EXPORT_RECIPIENT_PUBLIC_B64=' + recipient + '\n')
              fh.write('PARITY_EXPORT_RECIPIENT_KEY_ID=' + recipient_key_id + '\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write('parity_export_requested=' + ('true' if requested else 'false') + '\n')
          print('MMIBKR_SOURCE_VAULT_BOOTSTRAP_REQUEST=' + source_sha)
          print('MMIBKR_PARITY_EXPORT_REQUESTED=' + ('1' if requested else '0'))
          PY

      - name: Bootstrap reusable encrypted source-vault snapshot through Fleet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/mmibkr_fleet_source_vault_bootstrap_v1.py             --source-sha "$REQUEST_SOURCE_SHA"             --run-id "$GITHUB_RUN_ID"             --work-root "$RUNNER_TEMP/mmibkr-source-vault-bootstrap"             --output "$RUNNER_TEMP/mmibkr-source-vault-bootstrap-receipt.json"             --authority-base "$FLEET_AUTHORITY_BASE"             --public-repo XoticHaze/mm-ibkr-runtime             --public-branch mmibkr-source-vault             --token-env GH_TOKEN

      - name: Validate sanitized bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-source-vault-bootstrap-receipt.json'
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('ok') is not True:
              raise SystemExit('source-vault bootstrap not ok')
          if node.get('source_sha') != os.environ['REQUEST_SOURCE_SHA']:
              raise SystemExit('source-vault bootstrap source mismatch')
          if node.get('status') not in {'published', 'already_published'}:
              raise SystemExit('source-vault bootstrap status rejected')
          if node.get('runtime_private_repository_token_used') is not False:
              raise SystemExit('runtime private repository token boundary violated')
          if node.get('fleet_private_source_credential_exposed') is not False:
              raise SystemExit('Fleet private source credential exposure boundary violated')
          if node.get('public_plaintext_included') is not False:
              raise SystemExit('public plaintext boundary violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('live execution boundary violated')
          print('MMIBKR_SOURCE_VAULT_BOOTSTRAP=PASS')
          print('MMIBKR_SOURCE_VAULT_SOURCE_SHA=' + node['source_sha'])
          print('MMIBKR_SOURCE_VAULT_ARCHIVE_SHA256=' + node['archive_sha256'])
          print('MMIBKR_SOURCE_VAULT_MANIFEST_SHA256=' + node['manifest_sha256'])
          print('MMIBKR_SOURCE_VAULT_STATUS=' + node['status'])
          PY

      - name: Run existing MM no-broker config, checkpoint and futures regression tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # All decrypted-private-source subprocess output stays off public logs.
          private_cmd() {
            if "$@" >/dev/null 2>&1; then return 0; fi
            echo 'MMIBKR_PRIVATE_SOURCE_COMMAND=FAIL_CLOSED'
            return 1
          }
          # Reuse the already-admitted Fleet private-source materialization
          # on this Source Vault runner. No account credentials or orders.
          source_root="$RUNNER_TEMP/mmibkr-source-vault-bootstrap/fleet-extracted/mm-ibkr"
          if [ ! -d "$source_root" ]; then
            private_cmd python scripts/mmibkr_fleet_private_source_consumer_v1.py \
              --source-sha "$REQUEST_SOURCE_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --destination "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/fleet-extracted" \
              --archive-output "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/private-source.tar.gz" \
              --output "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/regression-source-receipt.json" \
              --authority-base "$FLEET_AUTHORITY_BASE"
          fi
          test -f "$source_root/main.py"
          test -f "$source_root/scripts/operator/selected_runtime_legacy_compat_config_v1.py"
          test -f "$source_root/scripts/operator/runtime_market_data_cache_checkpoint_v1.py"
          test -f "$source_root/scripts/operator/selected_runtime_live_incumbent_preflight_v1.py"
          echo 'MMIBKR_NATIVE_PRIVATE_STAGE=DEPENDENCIES'
          private_cmd python -m pip install --disable-pip-version-check \
            ib_insync==0.9.86 pandas==2.2.3
          (
            cd "$source_root"
            echo 'MMIBKR_NATIVE_PRIVATE_STAGE=COMPILE'
            private_cmd python -m py_compile \
              main.py \
              scripts/operator/selected_runtime_legacy_compat_config_v1.py \
              scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
              scripts/operator/selected_runtime_live_incumbent_preflight_v1.py
            # Same eight existing no-broker suites; isolate only the failed
            # module by a fixed literal identifier, never echo private output.
            for suite in \
              tests.test_selected_runtime_legacy_compat_config_v1 \
              tests.test_runtime_market_data_cache_checkpoint_v1 \
              tests.test_selected_runtime_live_incumbent_preflight_v1 \
              tests.test_selected_runtime_execution_roll_v1 \
              tests.test_selected_runtime_margin_whatif_hook_14th31lg \
              tests.test_futures_contract_registry \
              tests.test_futures_position_safety \
              tests.test_selected_runtime_futures_roll_maintenance_v1; do
              echo "MMIBKR_NATIVE_PRIVATE_STAGE=$suite"
              private_cmd python -m unittest -v "$suite"
            done
            if [ -f selected_runtime_futures_execution_roll_guard_v1.py ] &&
               [ -f tests/test_selected_runtime_futures_execution_roll_guard_v1.py ]; then
              private_cmd python -m py_compile selected_runtime_futures_execution_roll_guard_v1.py
              private_cmd python -m unittest -v tests.test_selected_runtime_futures_execution_roll_guard_v1
              echo 'MMIBKR_FUTURES_ROLL_GUARD_EXACT_SOURCE_TESTS=PASS'
            fi
            # Product #1390 selected P0 conId/reduce-only safety is a changed
            # private-source leaf. Reuse this exact encrypted no-broker runner;
            # never publish private Python assertion output to public logs.
            if [ -f tests/test_selected_futures_roll_identity_product_20261028.py ]; then
              private_cmd python -m py_compile \
                selected_runtime_futures_execution_roll_guard_v1.py \
                tests/test_selected_futures_roll_identity_product_20261028.py
              private_cmd python -m unittest -v \
                tests.test_selected_futures_roll_identity_product_20261028
              echo 'MMIBKR_P0_FUTURES_CONID_REDUCE_ONLY_EXACT_SOURCE_TESTS=PASS'
            fi
            # Product #1392 exact B1 roll-maintenance conId and warmup source
            # identity: same encrypted private source, no broker or extra job.
            if [ -f tests/test_futures_roll_conid_identity_product_20261028.py ]; then
              private_cmd python -m py_compile \
                scripts/operator/selected_runtime_futures_roll_maintenance_v1.py \
                tests/test_futures_roll_conid_identity_product_20261028.py
              private_cmd python -m unittest -v \
                tests.test_futures_roll_conid_identity_product_20261028
              echo 'MMIBKR_P0_FUTURES_ROLL_PRODUCER_EXACT_SOURCE_TESTS=PASS'
            fi
            # If this exact private source carries the proposed canonical
            # live-inventory guard, exercise it IN THE SAME encrypted run.
            # Older approved snapshots do not carry that test, so preserve
            # their established acceptance result.
            if [ -f tests/test_selected_runtime_live_inventory_authority_v1.py ]; then
              private_cmd python -m py_compile selected_runtime_live_inventory_authority_v1.py
              private_cmd python -m unittest -v \
                tests.test_selected_runtime_live_inventory_authority_v1 \
                tests.test_selected_runtime_position_ownership_integration_v1
              echo 'MMIBKR_LIVE_PERSISTED_INVENTORY_TESTS=PASS'
            fi
            # Changed-source P0 journal acceptance uses this same attested
            # private Source Vault runner, never a second launcher or broker.
            if [ -f selected_runtime_live_order_intent_journal_v1.py ] &&
               [ -f tests/test_selected_runtime_live_order_intent_journal_v1.py ]; then
              private_cmd python -m py_compile selected_runtime_live_order_intent_journal_v1.py
              private_cmd python -m unittest -v tests.test_selected_runtime_live_order_intent_journal_v1
              echo 'MMIBKR_P0_JOURNAL_EXACT_SOURCE_TESTS=PASS'
            fi
            # Selected #975 account-scoped successor read-only reconciliation
            # is a changed-source pre-merge acceptance, never a broker probe.
            # Legacy/other selected source snapshots do not carry this module.
            if [ -f tests/test_ibkr_live_successor_ledger_reconcile_v1.py ]; then
              private_cmd python -m py_compile scripts/operator/ibkr_live_successor_ledger_reconcile_v1.py
              private_cmd python -m unittest -v tests.test_ibkr_live_successor_ledger_reconcile_v1
              echo 'MMIBKR_SELECTED_P0_SUCCESSOR_LEDGER_SOURCE_TESTS=PASS'
            fi
            # Exact selected #883@92ff94 changed-source native acceptance.
            # Do not silently skip missing source/test or print private output.
            if [ "$REQUEST_SOURCE_SHA" = "92ff94ad2bcaee642c6fc3c7d4a3c78ad25fbb0e" ]; then
              if [ ! -f selected_runtime_boundary_snapshot_hydrator_v1.py ] ||
                 [ ! -f tests/test_selected_runtime_boundary_snapshot_hydrator_v1.py ]; then
                echo 'MMIBKR_P0_BOUNDARY_SNAPSHOT_HYDRATOR_EXACT_SOURCE=FAIL_CLOSED'
                exit 1
              fi
              private_cmd python -m py_compile \
                selected_runtime_boundary_snapshot_hydrator_v1.py \
                tests/test_selected_runtime_boundary_snapshot_hydrator_v1.py
              private_cmd python -m unittest -v \
                tests.test_selected_runtime_boundary_snapshot_hydrator_v1
              echo 'MMIBKR_P0_BOUNDARY_SNAPSHOT_HYDRATOR_EXACT_SOURCE=PASS'
            fi
            # Changed selected Product #1257 four-path no-loss merge: exercise
            # exact model preview authority guards on the admitted private
            # source in this existing encrypted, brokerless CI job.
            if [ -f tests/test_foundry_model_preview_flag_isolation_product_20261027.py ] &&
               [ -f tests/test_foundry_model_signal_date_product_20261027.py ]; then
              private_cmd python -m py_compile foundry_model_order_intent_adapter.py foundry_model_runtime_binding.py
              private_cmd python -m unittest -v tests.test_foundry_model_preview_flag_isolation_product_20261027 tests.test_foundry_model_signal_date_product_20261027
              echo 'MMIBKR_SELECTED_MODEL_PREVIEW_AUTHORITY_GUARDS=PASS'
            fi
            # Exact selected #975 Product #1286/#1288 changed-source acceptance only.
            # Source is authenticated encrypted-vault material; no broker/session,
            # P01 original, holdout, StrategySpec or live execution mutation.
            if [ "$REQUEST_SOURCE_SHA" = "9573aa32a4cd78773c0e06b0ad566128b8ec6666" ]; then
              private_cmd python -m py_compile \
                scripts/operator/selected_runtime_forward_execution_lifecycle_v1.py \
                feature_contract.py
              private_cmd python -m unittest -v \
                tests.test_selected_runtime_forward_execution_lifecycle_v1 \
                tests.test_feature_contract_same_tf_availability_product_20261027
              echo 'MMIBKR_SELECTED_PRODUCT_CAUSAL_GUARDS_EXACT_SOURCE=PASS'
            fi
            if [ -f tests/test_persistent_live_owner_prepare_v1.py ]; then
              private_cmd python -m py_compile scripts/operator/persistent_live_owner_prepare_v1.py
              private_cmd python -m unittest -v tests.test_persistent_live_owner_prepare_v1
              echo 'MMIBKR_PERSISTENT_HOST_LIVE_GATEWAY_TESTS=PASS'
            fi
            if [ -f cloudflare/mmibkr-live-cloud-owner/test/policy.test.mjs ]; then
              # This public runner holds decrypted private source in scratch.
              # Node failures, npm and Wrangler stderr can print source excerpts.
              if ! node --test cloudflare/mmibkr-live-cloud-owner/test/*.test.mjs >/dev/null 2>&1; then
                echo 'MMIBKR_CLOUDFLARE_LIVE_OWNER_CANARY_TESTS=FAIL_CLOSED'
                exit 1
              fi
              if ! (
                cd cloudflare/mmibkr-live-cloud-owner
                npm install --no-audit --no-fund --package-lock=false >/dev/null 2>&1
                npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/mmibkr-cloudflare-bundle" >/dev/null 2>&1
              ) >/dev/null 2>&1; then
                echo 'MMIBKR_CLOUDFLARE_WRANGLER_DRY_RUN=FAIL_CLOSED'
                exit 1
              fi
              echo 'MMIBKR_CLOUDFLARE_LIVE_OWNER_CANARY_TESTS=PASS'
              echo 'MMIBKR_CLOUDFLARE_WRANGLER_DRY_RUN=PASS'
              # Keep Wrangler failure detail private in ephemeral runner scratch;
              # never tail the private-source build log into public Actions output.
              if ! npx --yes wrangler@4.135.0 deploy \
                    --dry-run \
                    --config cloudflare/mmibkr-live-cloud-owner/wrangler.jsonc \
                    --outdir "$RUNNER_TEMP/mmibkr-cloudflare-canary-dryrun" \
                    >"$RUNNER_TEMP/mmibkr-cloudflare-canary-dryrun.log" 2>&1; then
                echo 'MMIBKR_CLOUDFLARE_CANARY_WRANGLER_DRY_RUN=FAIL_CLOSED'
                exit 1
              fi
              echo 'MMIBKR_CLOUDFLARE_CANARY_WRANGLER_DRY_RUN=PASS'
            fi
          )
          # Exercise the real module CLI on an isolated fixture, not only
          # an imported Python function. This is no broker/no secrets/no trade.
          (
            cd "$source_root"
            private_cmd python - <<'PY'
          import json
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          with tempfile.TemporaryDirectory(prefix="mmibkr-live-config-cli-smoke-") as td:
              work = Path(td)
              (work / "config").mkdir(parents=True)
              universe = json.loads((root / "config/selected_runtime_universe_14tu.json").read_text())
              selected = [r for r in universe["runtime_ids"] if r.get("status") == "active_selected"]
              assert {r["symbol"] for r in selected} == {"AMAT", "APH", "MNQ"}
              for row in selected:
                  row["execution_policy"]["live_submit_enabled"] = True
              (work / "config/selected_runtime_universe_14tu.json").write_text(
                  json.dumps(universe), encoding="utf-8"
              )
              catalog = "strategy_parameter_presets_14th23c.json"
              (work / "config" / catalog).write_bytes((root / "config" / catalog).read_bytes())
              private_config = work / "live_bot_runtime_config.json"
              sanitized_receipt = work / "live_config_source_receipt.json"
              subprocess.run(
                  [
                      sys.executable, "-m",
                      "scripts.operator.selected_runtime_legacy_compat_config_v1",
                      "--repo-root", str(work),
                      "--approved-live-selected-owner",
                      "--runtime-config-output", str(private_config),
                      "--output", str(sanitized_receipt),
                  ],
                  cwd=root, check=True, capture_output=True, text=True,
              )
              cfg = json.loads(private_config.read_text())
              receipt = json.loads(sanitized_receipt.read_text())
              assert receipt["ok"] is True
              assert receipt["approved_live_selected_owner_profile"] is True
              assert receipt["selected_symbols"] == ["AMAT", "APH", "MNQ"]
              assert cfg["ENABLE_LIVE_TRADING"] is True
              assert cfg["IB_HOST"] == "127.0.0.1" and cfg["IB_PORT"] == 4003
              assert cfg["CLOSE_ALL_POSITIONS_ON_START"] is False
              assert cfg["STRATEGY_AUTO_START_LOOPS_ENABLED"] is False
              assert cfg["FUTURES_ENABLED"] is True
              assert set(cfg["SELECTED_STRATEGY_SETS"]) >= {"AMAT", "APH", "MNQ"}
              for symbol in ("AMAT", "APH", "MNQ"):
                  assert cfg["SELECTED_STRATEGY_SETS"][symbol]["live_submit_enabled"] is True
              assert stat.S_IMODE(private_config.stat().st_mode) == 0o600
              assert "config" not in receipt
          print("MMIBKR_LIVE_EXISTING_CONFIG_MODULE_CLI_SMOKE=PASS")
          PY
          )
          echo 'MMIBKR_LIVE_EXISTING_CONFIG_MODULE_CLI_SMOKE=PASS'
          echo 'MMIBKR_EXISTING_NO_BROKER_RUNTIME_REGRESSION=PASS'
          echo "MMIBKR_REGRESSION_EXACT_SOURCE_SHA=$REQUEST_SOURCE_SHA"

      - name: Validate selected funded replay and PnL issuer hold from exact encrypted source
        shell: bash
        run: |
          set -euo pipefail
          # All decrypted-private-source subprocess output stays off public logs.
          private_cmd() {
            if "$@" >/dev/null 2>&1; then return 0; fi
            echo 'MMIBKR_PRIVATE_SOURCE_COMMAND=FAIL_CLOSED'
            return 1
          }
          source_root="$RUNNER_TEMP/mmibkr-source-vault-bootstrap/fleet-extracted/mm-ibkr"
          test -d "$source_root"
          if [ -f "$source_root/tests/test_backtest_partial_exit_declared_remaining_r1.py" ]; then
            private_cmd python -m pip install --disable-pip-version-check 'pytest==8.4.2'
            (
              cd "$source_root"
              private_cmd env PYTHONDONTWRITEBYTECODE=1 python -m pytest -q \
                tests/test_backtest_partial_exit_declared_remaining_r1.py \
                tests/test_capital_timestamp_binding_product_20261026.py \
                tests/test_selected_runtime_forward_completed_trade_admission_v1.py \
                tests/test_selected_runtime_forward_exact_extrema_canonical_v1.py
            )
            echo 'MMIBKR_SELECTED_FUNDED_PNL_NATIVE_EXACT_SOURCE=PASS'
          elif [ "$REQUEST_SOURCE_SHA" = "2dcd3c3f14b506f26dbf2e510029b13fd42f945e" ]; then
            echo 'MMIBKR_SELECTED_FUNDED_PNL_NATIVE_EXACT_SOURCE=MISSING' >&2
            exit 1
          else
            echo 'MMIBKR_SELECTED_FUNDED_PNL_NATIVE_EXACT_SOURCE=NOT_APPLICABLE'
          fi

      - name: Accept selected read-only operator UI pure Node contracts
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/mmibkr-source-vault-bootstrap/fleet-extracted/mm-ibkr"
          # P0 owner source has runtime tests but need not contain the full
          # selected operator UI test tree. Never misreport this as UI PASS.
          if [ "$REQUEST_VALIDATION_PROFILE" = 'p0_owner' ]; then
            # Caller-selected P0 profile is not authority to skip all native
            # acceptance. Require exact owner journal and successor source/tests;
            # their existing native suites ran in the prior fail-closed step.
            for required in \
              selected_runtime_live_order_intent_journal_v1.py \
              tests/test_selected_runtime_live_order_intent_journal_v1.py \
              scripts/operator/ibkr_live_successor_ledger_reconcile_v1.py \
              tests/test_ibkr_live_successor_ledger_reconcile_v1.py; do
              if [ ! -f "$source_root/$required" ]; then
                echo 'MMIBKR_P0_PROFILE_SOURCE_SCOPE=FAIL_CLOSED'
                exit 1
              fi
            done
            echo 'MMIBKR_P0_PROFILE_SOURCE_SCOPE=PASS'
            echo 'MMIBKR_SELECTED_UI_NATIVE_NODE_CONTRACTS=NOT_APPLICABLE_P0_OWNER'
            exit 0
          fi
          if [ "$REQUEST_VALIDATION_PROFILE" != 'strict_ui' ]; then
            echo 'MMIBKR_SELECTED_UI_NATIVE_NODE_CONTRACTS=FAIL_CLOSED'
            exit 1
          fi
          # Node assertion failures may print private source excerpts. This is
          # a PUBLIC workflow: never emit raw private test stdout/stderr.
          # Keep diagnostics in the private owner, not public Actions logs.
          tests=(
            ui-react/src/pages/BotConsolePage.acceptance.test.mjs
            ui-react/src/lib/botConsoleRecentActivity.test.mjs
            ui-react/src/lib/forwardEvidenceExactIdentity.test.mjs
            ui-react/src/operator-market-ui.acceptance.test.mjs
            ui-react/src/components/OperatorSubmitRouteTruth.test.mjs
          )
          case_no=0
          for test_path in "${tests[@]}"; do
            case_no=$((case_no + 1))
            # No file/path/error/source excerpt is emitted even on failure.
            if (cd "$source_root" && node "$test_path") >/dev/null 2>&1; then
              echo "MMIBKR_SELECTED_UI_NATIVE_CASE_${case_no}=PASS"
            else
              echo "MMIBKR_SELECTED_UI_NATIVE_CASE_${case_no}=FAIL"
              echo "MMIBKR_SELECTED_UI_NATIVE_NODE_CONTRACTS=FAIL_CLOSED"
              exit 1
            fi
          done
          echo 'MMIBKR_SELECTED_UI_NATIVE_NODE_CONTRACTS=PASS'

      - name: Encrypt exact private source for parity refresh
        if: ${{ steps.resolve.outputs.parity_export_requested == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmibkr-parity-export"
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF

          root = Path(os.environ['RUNNER_TEMP'])
          source = root / 'mmibkr-source-vault-bootstrap' / 'private-source.tar.gz'
          if not source.is_file():
              fallback = root / 'mmibkr-parity-private-source'
              fallback.mkdir(parents=True, exist_ok=True)
              import subprocess
              subprocess.run([
                  'python',
                  'scripts/mmibkr_fleet_private_source_consumer_v1.py',
                  '--source-sha', os.environ['REQUEST_SOURCE_SHA'],
                  '--run-id', os.environ['GITHUB_RUN_ID'],
                  '--destination', str(fallback / 'extracted'),
                  '--archive-output', str(fallback / 'private-source.tar.gz'),
                  '--output', str(fallback / 'receipt.json'),
                  '--authority-base', os.environ['FLEET_AUTHORITY_BASE'],
              ], check=True)
              source = fallback / 'private-source.tar.gz'
          if not source.is_file():
              raise SystemExit('parity private source archive unavailable after admitted fallback')
          raw = source.read_bytes()
          recipient_raw = base64.b64decode(os.environ['PARITY_EXPORT_RECIPIENT_PUBLIC_B64'], validate=True)
          recipient = x25519.X25519PublicKey.from_public_bytes(recipient_raw)
          eph = x25519.X25519PrivateKey.generate()
          eph_pub = eph.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          salt = os.urandom(32)
          nonce = os.urandom(12)
          key = HKDF(
              algorithm=hashes.SHA256(),
              length=32,
              salt=salt,
              info=b'mmibkr-parity-export-via-bootstrap-r1',
          ).derive(eph.exchange(recipient))
          aad = json.dumps({
              'schema':'mmibkr.parity_bootstrap_export_envelope.v1',
              'source_sha':os.environ['REQUEST_SOURCE_SHA'],
              'recipient_key_id':os.environ['PARITY_EXPORT_RECIPIENT_KEY_ID'],
          }, sort_keys=True, separators=(',',':')).encode()
          ciphertext = ChaCha20Poly1305(key).encrypt(nonce, raw, aad)
          out = root / 'mmibkr-parity-export'
          (out / 'ciphertext.bin').write_bytes(ciphertext)
          env = {
              'schema':'mmibkr.parity_bootstrap_export_envelope.v1',
              'source_sha':os.environ['REQUEST_SOURCE_SHA'],
              'recipient_key_id':os.environ['PARITY_EXPORT_RECIPIENT_KEY_ID'],
              'ephemeral_public_b64':base64.b64encode(eph_pub).decode(),
              'salt_b64':base64.b64encode(salt).decode(),
              'nonce_b64':base64.b64encode(nonce).decode(),
              'aad_b64':base64.b64encode(aad).decode(),
              'ciphertext_sha256':hashlib.sha256(ciphertext).hexdigest(),
              'ciphertext_bytes':len(ciphertext),
              'plaintext_sha256':hashlib.sha256(raw).hexdigest(),
              'plaintext_bytes':len(raw),
              'private_source_plaintext_published':False,
          }
          (out / 'envelope.json').write_text(json.dumps(env, sort_keys=True)+'\n', encoding='utf-8')
          print('MMIBKR_PARITY_BOOTSTRAP_EXPORT_ENCRYPTED=PASS')
          print('MMIBKR_PARITY_BOOTSTRAP_EXPORT_CIPHERTEXT_SHA256=' + env['ciphertext_sha256'])
          PY

      - name: Upload encrypted parity refresh source
        if: ${{ steps.resolve.outputs.parity_export_requested == 'true' }}
        id: parity_artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmibkr-parity-bootstrap-export-${{ github.run_id }}
          path: ${{ runner.temp }}/mmibkr-parity-export
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Emit sanitized parity export receipt
        if: ${{ steps.resolve.outputs.parity_export_requested == 'true' }}
        shell: bash
        run: |
          echo "MMIBKR_PARITY_BOOTSTRAP_EXPORT_STATUS=PASS"
          echo "MMIBKR_PARITY_BOOTSTRAP_EXPORT_SOURCE_SHA=$REQUEST_SOURCE_SHA"
          echo "MMIBKR_PARITY_BOOTSTRAP_EXPORT_ARTIFACT_ID=${{ steps.parity_artifact.outputs.artifact-id }}"
          echo "MMIBKR_PARITY_BOOTSTRAP_EXPORT_ARTIFACT_DIGEST=${{ steps.parity_artifact.outputs.artifact-digest }}"
          echo "MMIBKR_PARITY_BOOTSTRAP_EXPORT_PRIVATE_PLAINTEXT_PUBLISHED=0"

      - name: Destroy one-run private source material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf             "$RUNNER_TEMP/mmibkr-source-vault-bootstrap"             "$RUNNER_TEMP/mmibkr-source-vault-bootstrap-receipt.json"             "$RUNNER_TEMP/mmibkr-parity-export"             "$RUNNER_TEMP/mmibkr-parity-private-source"
          echo 'MMIBKR_SOURCE_VAULT_PRIVATE_MATERIAL_DESTROYED=1'
