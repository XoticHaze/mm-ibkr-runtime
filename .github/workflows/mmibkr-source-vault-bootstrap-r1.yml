name: MM-IBKR Source Vault Bootstrap R1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact code-approved private MM-IBKR source SHA
        required: true
        type: string
      validation_profile:
        description: Stage-scoped native acceptance (strict_ui by default; p0_owner excludes UI-only tests)
        required: false
        type: choice
        options:
          - strict_ui
          - p0_owner
  push:
    branches:
      - main
    paths:
      - 'rendezvous/fire/mmibkr-source-vault-bootstrap-r1'
      - '.github/workflows/mmibkr-source-vault-bootstrap-r1.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mmibkr-source-vault-bootstrap-r1.yml'
      - 'scripts/mmibkr_fleet_source_vault_bootstrap_v1.py'
      - 'scripts/mmibkr_fleet_private_source_consumer_v1.py'
      - 'scripts/mmibkr_source_vault_publish_v1.py'
      - 'tests/test_mmibkr_fleet_source_vault_bootstrap_v1.py'
      - 'tests/test_mmibkr_source_vault_v1.py'

permissions:
  contents: write
  id-token: write

concurrency:
  group: mmibkr-source-vault-bootstrap-r1
  cancel-in-progress: false

env:
  FLEET_AUTHORITY_BASE: https://fleet-authority.slenderiq.workers.dev

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.16'

      - name: Validate source-vault bootstrap tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography==46.0.1
          python -m py_compile             scripts/mmibkr_fleet_private_source_consumer_v1.py             scripts/mmibkr_fleet_source_vault_bootstrap_v1.py             scripts/mmibkr_source_vault_publish_v1.py
          python -m unittest -v             tests.test_mmibkr_fleet_source_vault_bootstrap_v1             tests.test_mmibkr_source_vault_v1

  bootstrap:
    if: ${{ github.event_name != 'pull_request' }}
    needs: contract
    # Native ARM64 host, not x86 QEMU or a source-only emulated build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.16'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1

      - name: Resolve exact source request
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          recipient = ''
          recipient_key_id = ''
          validation_profile = 'strict_ui'
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              fire = Path('rendezvous/fire/mmibkr-source-vault-bootstrap-r1')
              if not fire.is_file():
                  raise SystemExit('source-vault bootstrap fire request missing')
              node = json.loads(fire.read_text(encoding='utf-8'))
              source_sha = str(node.get('source_sha') or '').strip().lower()
              validation_profile = str(node.get('validation_profile') or 'strict_ui').strip().lower()
              recipient = str(node.get('parity_export_recipient_public_b64') or '').strip()
              recipient_key_id = str(node.get('parity_export_recipient_key_id') or '').strip()
          else:
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
              source_sha = str((event.get('inputs') or {}).get('source_sha') or '').strip().lower()
              validation_profile = str((event.get('inputs') or {}).get('validation_profile') or 'strict_ui').strip().lower()

          if len(source_sha) != 40 or any(ch not in '0123456789abcdef' for ch in source_sha):
              raise SystemExit('exact 40-hex source_sha required')
          if validation_profile not in {'strict_ui', 'p0_owner'}:
              raise SystemExit('source validation profile rejected')

          requested = bool(recipient or recipient_key_id)
          if requested:
              import base64, hashlib
              raw = base64.b64decode(recipient, validate=True)
              if len(raw) != 32:
                  raise SystemExit('parity export recipient key rejected')
              expected_key_id = 'sha256:' + hashlib.sha256(raw).hexdigest()
              if recipient_key_id != expected_key_id:
                  raise SystemExit('parity export recipient key id mismatch')

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write('REQUEST_SOURCE_SHA=' + source_sha + '\n')
              fh.write('REQUEST_VALIDATION_PROFILE=' + validation_profile + '\n')
              fh.write('PARITY_EXPORT_RECIPIENT_PUBLIC_B64=' + recipient + '\n')
              fh.write('PARITY_EXPORT_RECIPIENT_KEY_ID=' + recipient_key_id + '\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write('parity_export_requested=' + ('true' if requested else 'false') + '\n')
          print('MMIBKR_SOURCE_VAULT_BOOTSTRAP_REQUEST=' + source_sha)
          print('MMIBKR_PARITY_EXPORT_REQUESTED=' + ('1' if requested else '0'))
          PY

      - name: Bootstrap reusable encrypted source-vault snapshot through Fleet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/mmibkr_fleet_source_vault_bootstrap_v1.py             --source-sha "$REQUEST_SOURCE_SHA"             --run-id "$GITHUB_RUN_ID"             --work-root "$RUNNER_TEMP/mmibkr-source-vault-bootstrap"             --output "$RUNNER_TEMP/mmibkr-source-vault-bootstrap-receipt.json"             --authority-base "$FLEET_AUTHORITY_BASE"             --public-repo XoticHaze/mm-ibkr-runtime             --public-branch mmibkr-source-vault             --token-env GH_TOKEN

      - name: Validate sanitized bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'mmibkr-source-vault-bootstrap-receipt.json'
          node = json.loads(path.read_text(encoding='utf-8'))
          if node.get('ok') is not True:
              raise SystemExit('source-vault bootstrap not ok')
          if node.get('source_sha') != os.environ['REQUEST_SOURCE_SHA']:
              raise SystemExit('source-vault bootstrap source mismatch')
          if node.get('status') not in {'published', 'already_published'}:
              raise SystemExit('source-vault bootstrap status rejected')
          if node.get('runtime_private_repository_token_used') is not False:
              raise SystemExit('runtime private repository token boundary violated')
          if node.get('fleet_private_source_credential_exposed') is not False:
              raise SystemExit('Fleet private source credential exposure boundary violated')
          if node.get('public_plaintext_included') is not False:
              raise SystemExit('public plaintext boundary violated')
          if node.get('live_execution_allowed') is not False:
              raise SystemExit('live execution boundary violated')
          print('MMIBKR_SOURCE_VAULT_BOOTSTRAP=PASS')
          print('MMIBKR_SOURCE_VAULT_SOURCE_SHA=' + node['source_sha'])
          print('MMIBKR_SOURCE_VAULT_ARCHIVE_SHA256=' + node['archive_sha256'])
          print('MMIBKR_SOURCE_VAULT_MANIFEST_SHA256=' + node['manifest_sha256'])
          print('MMIBKR_SOURCE_VAULT_STATUS=' + node['status'])
          PY

      - name: Build selected canonical Pi image on native ARM64 (ephemeral, private)
        id: native_pi_arm64_image
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ "$REQUEST_VALIDATION_PROFILE" != 'p0_owner' ]; then
            echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=NOT_APPLICABLE_UI_PROFILE'
            exit 0
          fi
          # This builds the SAME exact-SHA decrypted source already materialized
          # and tested inside the admitted encrypted-source consumer. Neither
          # Docker build logs nor private source are emitted on public Actions.
          # No registry push, public artifact, Pi install, or broker connection.
          source_root="$RUNNER_TEMP/mmibkr-source-vault-bootstrap/fleet-extracted/mm-ibkr"
          # The encrypted archive may already exist in Source Vault, in
          # which case bootstrap does not fetch/extract it again. Materialize
          # the exact authenticated source before building, just as the
          # existing brokerless regression step already does. Suppress all
          # private source output; do not weaken any native acceptance gate.
          if [ ! -d "$source_root" ]; then
            if ! python scripts/mmibkr_fleet_private_source_consumer_v1.py \
                --source-sha "$REQUEST_SOURCE_SHA" \
                --run-id "$GITHUB_RUN_ID" \
                --destination "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/fleet-extracted" \
                --archive-output "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/private-source.tar.gz" \
                --output "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/native-build-source-receipt.json" \
                --authority-base "$FLEET_AUTHORITY_BASE" >/dev/null 2>&1; then
              echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=PRIVATE_SOURCE_FETCH_FAILED'
              exit 1
            fi
          fi
          test -f "$source_root/deploy/pi-bot/Dockerfile" || {
            echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=SOURCE_MISSING'
            exit 1
          }
          test -f "$source_root/deploy/pi-bot/Dockerfile.dockerignore" || {
            echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=CONTEXT_GUARD_MISSING'
            exit 1
          }
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=NOT_NATIVE_ARM64'; exit 1 ;;
          esac
          image_tag="mmibkr-pi-native-review:${REQUEST_SOURCE_SHA:0:12}"
          if ! (cd "$source_root" && docker build \
              --platform linux/arm64 \
              --pull \
              --no-cache \
              --build-arg "MMIBKR_SELECTED_SOURCE_SHA=$REQUEST_SOURCE_SHA" \
              --file deploy/pi-bot/Dockerfile \
              --tag "$image_tag" .) >/dev/null 2>&1; then
            echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=FAILED'
            exit 1
          fi
          image_arch="$(docker image inspect --format '{{.Architecture}}' "$image_tag")"
          image_os="$(docker image inspect --format '{{.Os}}' "$image_tag")"
          image_rev="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_tag")"
          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          if [ "$image_arch" != arm64 ] || [ "$image_os" != linux ] || \
             [ "$image_rev" != "$REQUEST_SOURCE_SHA" ] || \
             [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=IDENTITY_REJECTED'
            exit 1
          fi
          # A disconnected, read-only import check is not a broker inspection
          # and does not create a Pi trading process or order.
          if ! docker run --rm --pull never --platform linux/arm64 \
            --network none --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --memory 1200m --cpus 1.25 \
            --env MMIBKR_PI_BOT_OWNER_MODE=1 \
            --entrypoint python "$image_tag" \
            -c 'import indicators' >/dev/null 2>&1; then
            echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=READONLY_IMPORT_FAILED'
            exit 1
          fi
          # Measure the REAL image disk footprint and compressed Docker
          # transport footprint. Only sanitized integers reach public logs:
          # no private image layers, source or credentials are uploaded.
          image_bytes="$(docker image inspect --format '{{.Size}}' "$image_tag")"
          if ! [[ "$image_bytes" =~ ^[1-9][0-9]*$ ]]; then
            echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_SIZE=REJECTED'
            exit 1
          fi
          archive_bytes="$(docker save "$image_tag" | gzip -1 | wc -c | tr -d '[:space:]')"
          if ! [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]; then
            echo 'MMIBKR_PI_NATIVE_ARM64_ARCHIVE_SIZE=REJECTED'
            exit 1
          fi
          echo "MMIBKR_PI_NATIVE_ARM64_IMAGE_BYTES=$image_bytes"
          echo "MMIBKR_PI_NATIVE_ARM64_COMPRESSED_BYTES=$archive_bytes"
          # Image ID identifies ephemeral runner layers, not a deliverable
          # registry RepoDigest. Never publish private layers in a public repo.
          echo 'MMIBKR_PI_NATIVE_ARM64_IMAGE_BUILD=PASS'
          echo "MMIBKR_PI_NATIVE_ARM64_SOURCE_SHA=$REQUEST_SOURCE_SHA"
          echo "MMIBKR_PI_NATIVE_ARM64_IMAGE_ID=$image_id"
          echo 'MMIBKR_PI_IMAGE_REGISTRY_DIGEST=NOT_PUBLISHED'
          echo 'MMIBKR_PI_BOT_INSTALLED=0'
          echo 'MMIBKR_PI_BOT_LIVE_SUBMIT=0'

      - name: Stage exact ARM64 bot image in private GHCR (admission remains separate)
        if: ${{ github.event_name == 'push' }}
        env:
          PRIVATE_IMAGE_PUSH_PAT: ${{ secrets.MMIBKR_GHCR_PRIVATE_PUSH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Only the pinned selected-source image can be privately staged.
          # This is artifact availability, NOT native source acceptance or
          # root deployment approval. Later P0 tests may still fail closed. GHCR credentials are never provided to PR jobs.
          if [ "$REQUEST_VALIDATION_PROFILE" != p0_owner ] ||
             [ "$REQUEST_SOURCE_SHA" != 2b5513c161b6ca3f1a08c2f803490b2c1fdee187 ]; then
            echo 'MMIBKR_PRIVATE_GHCR_PUBLICATION=NOT_APPLICABLE'
            exit 0
          fi
          if [ -z "${PRIVATE_IMAGE_PUSH_PAT:-}" ]; then
            echo 'MMIBKR_PRIVATE_GHCR_PUBLICATION=OPERATOR_SECRET_REQUIRED'
            exit 0
          fi
          image="mmibkr-pi-native-review:${REQUEST_SOURCE_SHA:0:12}"
          repo="ghcr.io/xotichaze/mmibkr-pi-canonical-private-20261030"
          tag="$repo:$REQUEST_SOURCE_SHA"
          if [ "$(docker image inspect --format '{{.Architecture}}' "$image")" != arm64 ] ||
             [ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" != "$REQUEST_SOURCE_SHA" ]; then
            echo 'MMIBKR_PRIVATE_GHCR_PUBLICATION=SOURCE_IDENTITY_REJECTED'
            exit 1
          fi
          # This is a narrowly scoped classic PAT, NOT public GITHUB_TOKEN.
          # A new PAT-published unlinked GHCR package defaults PRIVATE.
          # Refuse an existing package when it is not demonstrably private.
          endpoint="https://api.github.com/users/XoticHaze/packages/container/mmibkr-pi-canonical-private-20261030"
          response="$RUNNER_TEMP/mmibkr-ghcr-private-package.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $PRIVATE_IMAGE_PUSH_PAT" \
            --header "Accept: application/vnd.github+json" "$endpoint" || true)"
          if [ "$status" = 200 ]; then
            if ! python - "$response" <<'PY'
          import json,sys
          try:
              p=json.load(open(sys.argv[1], encoding="utf-8"))
              assert p.get("visibility")=="private"
          except (OSError, ValueError, AssertionError):
              raise SystemExit(1)
          PY
            then
              echo 'MMIBKR_PRIVATE_GHCR_VISIBILITY=REJECTED'
              exit 1
            fi
          elif [ "$status" != 404 ]; then
            echo 'MMIBKR_PRIVATE_GHCR_VISIBILITY=UNVERIFIED'
            exit 1
          fi
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/mmibkr-ghcr-push.log" "$RUNNER_TEMP/mmibkr-ghcr-private-package.json"' EXIT
          if ! printf '%s' "$PRIVATE_IMAGE_PUSH_PAT" | \
               docker login ghcr.io --username XoticHaze --password-stdin >/dev/null 2>&1; then
            echo 'MMIBKR_PRIVATE_GHCR_AUTH=FAILED'
            exit 1
          fi
          docker tag "$image" "$tag"
          if ! docker push "$tag" >"$RUNNER_TEMP/mmibkr-ghcr-push.log" 2>&1; then
            echo 'MMIBKR_PRIVATE_GHCR_PUSH=FAILED'
            exit 1
          fi
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' \
             "$RUNNER_TEMP/mmibkr-ghcr-push.log" | tail -n 1)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'MMIBKR_PRIVATE_GHCR_DIGEST=UNVERIFIED'
            exit 1
          fi
          immutable="$repo@$digest"
          if ! docker pull "$immutable" >/dev/null 2>&1; then
            echo 'MMIBKR_PRIVATE_GHCR_DIGEST_PULL=FAILED'
            exit 1
          fi
          if [ "$(docker image inspect --format '{{.Architecture}}' "$immutable")" != arm64 ] ||
             [ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$immutable")" != "$REQUEST_SOURCE_SHA" ]; then
            echo 'MMIBKR_PRIVATE_GHCR_DIGEST_IDENTITY=REJECTED'
            exit 1
          fi
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $PRIVATE_IMAGE_PUSH_PAT" \
            --header "Accept: application/vnd.github+json" "$endpoint" || true)"
          if [ "$status" != 200 ] || ! python - "$response" <<'PY'
          import json,sys
          try:
              assert json.load(open(sys.argv[1], encoding="utf-8")).get("visibility")=="private"
          except (OSError, ValueError, AssertionError):
              raise SystemExit(1)
          PY
          then
            echo 'MMIBKR_PRIVATE_GHCR_POSTPUSH_VISIBILITY=REJECTED'
            exit 1
          fi
          echo "MMIBKR_PRIVATE_GHCR_REF=$immutable"
          echo 'MMIBKR_PRIVATE_GHCR_PUBLICATION=PASS'
          echo 'MMIBKR_PI_INSTALLED=0'
          echo 'MMIBKR_LIVE_ORDER_SUBMISSION=0'

      - name: Run existing MM no-broker config, checkpoint and futures regression tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # All decrypted-private-source subprocess output stays off public logs.
          private_cmd() {
            if "$@" >/dev/null 2>&1; then return 0; fi
            echo 'MMIBKR_PRIVATE_SOURCE_COMMAND=FAIL_CLOSED'
            return 1
          }
          # Reuse the already-admitted Fleet private-source materialization
          # on this Source Vault runner. No account credentials or orders.
          source_root="$RUNNER_TEMP/mmibkr-source-vault-bootstrap/fleet-extracted/mm-ibkr"
          if [ ! -d "$source_root" ]; then
            private_cmd python scripts/mmibkr_fleet_private_source_consumer_v1.py \
              --source-sha "$REQUEST_SOURCE_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --destination "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/fleet-extracted" \
              --archive-output "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/private-source.tar.gz" \
              --output "$RUNNER_TEMP/mmibkr-source-vault-bootstrap/regression-source-receipt.json" \
              --authority-base "$FLEET_AUTHORITY_BASE"
          fi
          test -f "$source_root/main.py"
          test -f "$source_root/scripts/operator/selected_runtime_legacy_compat_config_v1.py"
          test -f "$source_root/scripts/operator/runtime_market_data_cache_checkpoint_v1.py"
          test -f "$source_root/scripts/operator/selected_runtime_live_incumbent_preflight_v1.py"
          echo 'MMIBKR_NATIVE_PRIVATE_STAGE=DEPENDENCIES'
          private_cmd python -m pip install --disable-pip-version-check \
            ib_insync==0.9.86 pandas==2.2.3
          # Frozen 1dc1 module-1 loader needs the selected daemon's direct
          # import-time API dependencies. Pin only this brokerless profile;
          # never install the full private requirements or start a server.
          if { [ "$REQUEST_SOURCE_SHA" = "1dc1fe84132d95ff4b25ad601d6f4493c2ff85ae" ] || [ "$REQUEST_SOURCE_SHA" = "b3a94f6c1a5a4866386e2486f6244a89fc66170c" ] || [ "$REQUEST_SOURCE_SHA" = "fff4d5b1a1b3521f34d5b530a008e17e19a054cb" ] || [ "$REQUEST_SOURCE_SHA" = "be26b149de4b706427de65dc835a71c7428c0b65" ]; } &&
             [ "$REQUEST_VALIDATION_PROFILE" = "p0_owner" ]; then
            private_cmd python -m pip install --disable-pip-version-check \
              fastapi==0.128.2 uvicorn==0.48.0 requests==2.32.5
            echo 'MMIBKR_P0_1DC1_IMPORT_DEPENDENCIES=PASS'
          fi
          if [ "$REQUEST_SOURCE_SHA" = "be26b149de4b706427de65dc835a71c7428c0b65" ] && [ "$REQUEST_VALIDATION_PROFILE" = "p0_owner" ]; then
            # Two changed integrity modules are pytest-function modules, not
            # unittest.TestCase. Execute their tmp_path/raises checks for real.
            private_cmd python -m pip install --disable-pip-version-check pytest==8.3.5
            echo 'MMIBKR_P0_BE26_PYTEST_DEPENDENCY=PASS'
          fi
          (
            cd "$source_root"
            echo 'MMIBKR_NATIVE_PRIVATE_STAGE=COMPILE'
            private_cmd python -m py_compile \
              main.py \
              scripts/operator/selected_runtime_legacy_compat_config_v1.py \
              scripts/operator/runtime_market_data_cache_checkpoint_v1.py \
              scripts/operator/selected_runtime_live_incumbent_preflight_v1.py
            # Same eight existing no-broker suites; isolate only the failed
            # module by a fixed literal identifier, never echo private output.
            for suite in \
              tests.test_selected_runtime_legacy_compat_config_v1 \
              tests.test_runtime_market_data_cache_checkpoint_v1 \
              tests.test_selected_runtime_live_incumbent_preflight_v1 \
              tests.test_selected_runtime_execution_roll_v1 \
              tests.test_selected_runtime_margin_whatif_hook_14th31lg \
              tests.test_futures_contract_registry \
              tests.test_futures_position_safety \
              tests.test_selected_runtime_futures_roll_maintenance_v1; do
              echo "MMIBKR_NATIVE_PRIVATE_STAGE=$suite"
              if [ "$suite" = "tests.test_selected_runtime_live_incumbent_preflight_v1" ]; then
                # The private native source remains silent. Only the ordinal of
                # a failed existing test may leave the redacted CI boundary.
                # Redact all private-case output, write only bounded ordinal into
                # runner-local ephemeral file for fixed-field status.
                if private_cmd python - <<'PY'
          import contextlib, os, sys, unittest
          from pathlib import Path
          def flatten(group):
              for item in group:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          try:
              suite = unittest.defaultTestLoader.loadTestsFromName(
                  "tests.test_selected_runtime_live_incumbent_preflight_v1")
              cases = list(flatten(suite))
              if not cases:
                  raise RuntimeError("no_cases")
              with open("/dev/null", "w") as sink:
                  for ordinal, case in enumerate(cases, 1):
                      with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                          result = unittest.TestResult()
                          case.run(result)
                      if not result.wasSuccessful():
                          Path(os.environ["RUNNER_TEMP"], "mmibkr-preflight-ordinal.txt").write_text(str(ordinal))
                          raise SystemExit(1)
              print("MMIBKR_P0_PREFLIGHT_CASES_COMPLETE=" + str(len(cases)))
          except SystemExit:
              raise
          except BaseException:
              print("MMIBKR_P0_PREFLIGHT_CASE_DISCOVERY_FAILED")
              raise SystemExit(1)
          PY
                then
                  echo 'MMIBKR_P0_PREFLIGHT_PRIVATE_NATIVE=PASS'
                else
                  ordinal_file="$RUNNER_TEMP/mmibkr-preflight-ordinal.txt"
                  if [ -s "$ordinal_file" ]; then
                    ordinal="$(cat "$ordinal_file")"
                    case "$ordinal" in
                      [1-9]|1[0-7])
                        echo "MMIBKR_P0_PREFLIGHT_CASE_FAILED_ORDINAL=$ordinal"
                        ;;
                    esac
                  fi
                  exit 1
                fi
              else
                private_cmd python -m unittest -v "$suite"
              fi
            done
            if [ -f selected_runtime_futures_execution_roll_guard_v1.py ] &&
               [ -f tests/test_selected_runtime_futures_execution_roll_guard_v1.py ]; then
              private_cmd python -m py_compile selected_runtime_futures_execution_roll_guard_v1.py
